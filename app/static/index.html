<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Ai-Humanizer</title>
<style>
body{font-family:system-ui;margin:0;background:#0f1115;color:#e6e6e6}
header{padding:16px 24px;border-bottom:1px solid #222;display:flex;justify-content:space-between}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 24px}
textarea{width:100%;height:50vh;background:#171a21;color:#eee;border:1px solid #2a2f3a;border-radius:8px;padding:12px;box-sizing:border-box;font-size:15px}
button,select{background:#3b82f6;color:#fff;border:0;border-radius:8px;padding:10px 16px;margin:6px 6px 0 0;cursor:pointer}
select{background:#222}.card{background:#171a21;border-radius:8px;padding:10px;margin-top:8px;font-size:14px}
.s{font-size:28px;font-weight:700}small{color:#999}
</style>
<header><b>Ai-Humanizer</b><small id=h>…</small></header>
<main>
<section><h3>Input</h3><textarea id=in placeholder="Paste your English text (min 30 words)…"></textarea>
<textarea id=sample style="height:70px;margin-top:8px" placeholder="Optional: paste a sample of YOUR own writing to match your voice"></textarea>
<input type=file id=f accept=".txt,.md,.docx,.pdf">
<select id=st><option value=academic>Academic</option><option value=practical>Practical</option><option value=casual>Casual</option></select>
<button onclick=run()>Humanize</button><button onclick=ana()>Analyze only</button>
<div class=card id=a1></div></section>
<section><h3>Output</h3><textarea id=out></textarea>
<button onclick="navigator.clipboard.writeText(out.value)">Copy</button>
<div class=card id=a2></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const rep=(r,t)=>!r||r.score==null?(r&&r.note||''):`<div class=s>${r.score}/100 <small>AI-likeness (${t})</small></div><small>burstiness ${r.metrics.burstiness} · avg sentence ${r.metrics.avg_sentence_len}</small><ul>${r.signals.map(s=>`<li>${s.message}</li>`).join('')}</ul>`;
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{if(!r.ok)throw new Error((await r.json()).detail);return r.json()});
async function ana(){$('a1').innerHTML=rep(await post('/api/analyze',{text:$('in').value}),'input')}
async function run(){$('out').value='Working… (local model, may take a while)';
 try{const r=await post('/api/humanize',{text:$('in').value,style:$('st').value,sample:$('sample').value});
 $('out').value=r.text;$('a1').innerHTML=rep(r.before,'before');$('a2').innerHTML=rep(r.after,'after')}catch(e){$('out').value='Error: '+e.message}}
$('f').onchange=async e=>{const fd=new FormData();fd.append('file',e.target.files[0]);
 const r=await fetch('/api/extract',{method:'POST',body:fd});const j=await r.json();$('in').value=j.text||j.detail};
fetch('/api/health').then(r=>r.json()).then(j=>$('h').textContent=j.ollama?(j.model_installed?'model ready: '+j.model:'run: ollama pull '+j.model):'Ollama not running');
</script>
